# font.jennysoft.co.kr — JennySans 소개 홈페이지 + 폰트 CDN + 다운로드 (server: 175.127.49.246 / debc-dev, Rocky Linux 10, nginx 계정 nginx)
# 파일: /etc/nginx/conf.d/font.conf          (원본: JennySans/deploy/nginx-font.conf) — qaudio.conf 와 같은 골격
#
# 인증서: acme.sh --alpn --server letsencrypt (TLS-ALPN-01, 외부 80 미개방) — 팀장이 서버에서 직접 발급·설치
#         /etc/pki/tls/certs/font.crt · /etc/pki/tls/private/font.key
#         갱신: /usr/local/sbin/renew-font-cert.sh (renew-qaudio-cert.sh 복제) + 새벽 cron
#         ⚠ acme.sh 기본 CA(ZeroSSL)는 계정 이메일이 없어 실패한다 — `--server letsencrypt` 필수(qaudio 선례).
#
# 디렉터리 (deploy/deploy.sh → deploy/remote-install.sh 가 만든다)
#   /var/www/font/
#     index.html …                          ← site/ (소개 홈페이지, font-site 소유)
#     v/1.000/{static,variable,web,css}/    ← dist/ (버전 고정, immutable 1년)
#     v/1.000/{LICENSE,THIRD-PARTY-NOTICES.md,README.md,CHANGELOG.md}
#     latest -> v/1.000                     ← 별칭(5분 캐시)
#     download/                             ← dist/packages/ (zip 3종 + SHA256SUMS.txt, 5분 캐시, 첨부 다운로드)
#
# 핵심 규칙 (docs/spec/05-web.md §6 · docs/DISTRIBUTION.md §2~3)
#   - 모든 폰트·CSS 응답에 Access-Control-Allow-Origin: * — 없으면 다른 도메인 페이지에서 폰트가 조용히 무시된다(curl 200 이어도).
#   - /v/… 는 Cache-Control: public, max-age=31536000, immutable (같은 버전 경로의 파일 내용은 절대 바꾸지 않는다).
#   - WOFF2·zip 은 gzip 하지 않는다(이미 압축). html/css/js/json 만 gzip.
#   - nginx 의 add_header 는 자식 location 에 add_header 가 하나라도 있으면 부모 것을 상속하지 않는다 → location 마다 전부 반복.
#   - `types {}` 는 그 location 의 MIME 표를 통째로 바꾼다 → 확장자별 location 안에서만 쓴다.
#   - 정규식 location 은 적힌 순서대로 첫 매치가 이긴다 → /v/ → /latest/ → /download/ → 홈페이지 정적 순으로 둔다.

# ---------- HTTP(80) → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name font.jennysoft.co.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name font.jennysoft.co.kr;

    ssl_certificate     /etc/pki/tls/certs/font.crt;
    ssl_certificate_key /etc/pki/tls/private/font.key;
    include snippets/ssl-common.conf;

    root /var/www/font;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain text/markdown application/javascript application/json;

    access_log /var/log/nginx/font.access.log;
    error_log  /var/log/nginx/font.error.log;

    client_max_body_size 1m;      # 업로드 없음

    # 압축은 html(기본)·css·js·json 만. font/* 와 zip 은 넣지 않는다.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # 숨김 파일·백업 디렉터리(v/1.000.bak.<ts>, site.bak.<ts>, download.bak.<ts>)는 노출하지 않는다
    location ~ /\.            { return 404; }
    location ~* \.bak\.[0-9]  { return 404; }

    # ── ① 폰트 CDN: 버전 경로 /v/<ver>/ (immutable) ──────────────────
    location ~* ^/v/[^/]+/.+\.(woff2|woff|ttf|otf)$ {
        types { font/woff2 woff2; font/woff woff; font/ttf ttf; font/otf otf; }
        default_type application/octet-stream;
        gzip off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Max-Age       "86400" always;
        add_header Timing-Allow-Origin          "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method = OPTIONS) { return 204; }
    }
    location ~* ^/v/[^/]+/.+\.css$ {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method = OPTIONS) { return 204; }
    }
    location /v/ {
        # LICENSE(확장자 없음)·README.md·CHANGELOG.md 등
        types { text/markdown md; text/plain txt; }
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── ② 별칭 /latest/ (심링크 → v/<ver>, 5분 캐시) ─────────────────
    location ~* ^/latest/.+\.(woff2|woff|ttf|otf)$ {
        types { font/woff2 woff2; font/woff woff; font/ttf ttf; font/otf otf; }
        default_type application/octet-stream;
        gzip off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Timing-Allow-Origin          "*" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method = OPTIONS) { return 204; }
    }
    location ~* ^/latest/ {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    # ── ③ 다운로드 /download/ (zip 3종 + SHA256SUMS.txt, 5분 캐시) ─────
    location ~* ^/download/.+\.zip$ {
        types { application/zip zip; }
        default_type application/zip;
        gzip off;
        add_header Content-Disposition "attachment" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /download/ {
        types { text/plain txt; text/markdown md; }
        default_type text/plain;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # ── ④ 소개 홈페이지 (site/ → 루트, font-site 소유) ──────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2|ttf|json|txt)$ {
        # 홈페이지 자체 에셋(같은 오리진). 폰트·CSS 는 위 /v/·/latest/ 규칙이 먼저 매치되므로 여기는 site 파일만
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location = /LICENSE {
        default_type text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
